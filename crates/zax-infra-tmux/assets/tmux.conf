# zax's own tmux configuration. It is loaded with `-f`, on a socket of its own,
# so it can neither read nor disturb a personal tmux setup.

set -g prefix {{PREFIX}}
unbind C-b
bind {{PREFIX}} send-prefix

# Pane 0 is the agent and should swallow as few keystrokes as possible, so pane
# switching is also bound unprefixed.
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# The Zed terminal is small and panes carry their own headers.
set -g status off
set -g pane-border-status off

set -g base-index 0
setw -g pane-base-index 0
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"

# Closing one session must not tear down the server other worktrees are using.
set -g detach-on-destroy off
