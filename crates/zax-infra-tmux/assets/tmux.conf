# zax's own tmux configuration. It is loaded with `-f`, on a socket of its own,
# so it can neither read nor disturb a personal tmux setup.

set -g prefix {{PREFIX}}
unbind C-b
bind {{PREFIX}} send-prefix

# Pane 0 is the agent and should swallow as few keystrokes as possible, so pane
# switching is also bound unprefixed.
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Zed names an agent terminal thread from the OSC 0/2 title on its pty, falling
# back to the foreground process when none arrives. With set-titles off - the
# tmux default - the agent's title stops at the pane, so Zed only ever sees
# `tmux` and Claude Code's session name never reaches the thread list.
#
# Forward it, pinned to the agent. A bare `#{pane_title}` resolves against
# whichever pane is active, so moving focus to a context pane handed Zed that
# pane's title and renamed the thread. Looping the window's panes and emitting
# only pane 0's keeps the thread named by Claude wherever focus sits, while a
# new title from the agent still reaches Zed immediately. tmux's own default
# string is no better than the bare title: it prefixes session, window and
# index, which is noise in a thread list.
set -g set-titles on
set -g set-titles-string "#{P:#{?#{==:#{pane_index},0},#{pane_title},}}"

# The config editor, in a popup over the session. It writes files and reports
# what a running session cannot pick up; it never respawns a pane, so it needs
# no access to this server beyond the popup it draws in.
#
# `-d` because `zax config` resolves the repository from its working directory,
# and a popup without it starts wherever the server did - which is another
# worktree, whose config it would then edit.
bind C display-popup -E -b rounded -T ' zax config ' -w 80% -h 85% \
    -d '#{pane_current_path}' '{{ZAX}} config'

# The Zed terminal is small and panes carry their own headers.
set -g status off
set -g pane-border-status off

set -g base-index 0
setw -g pane-base-index 0
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "tmux-256color"

# Closing one session must not tear down the server other worktrees are using.
set -g detach-on-destroy off
